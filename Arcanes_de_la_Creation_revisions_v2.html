<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Arcanes de la Création — Fiches de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1815;
  --ink-card:#232019;
  --ink-card-2:#29251d;
  --paper:#ece4d4;
  --paper-dim:#b7ae98;
  --paper-faint:#8c8571;
  --rule:#413c2f;
  --rule-soft:#2c2921;

  --gold:#c9a24c;
  --gold-soft:rgba(201,162,76,.13);
  --gold-line:rgba(201,162,76,.35);

  --verdigris:#83a98c;
  --verdigris-soft:rgba(131,169,140,.13);
  --verdigris-line:rgba(131,169,140,.35);

  --plum:#ab8fb5;
  --plum-soft:rgba(171,143,181,.13);
  --plum-line:rgba(171,143,181,.35);

  --accent:var(--gold);
  --accent-soft:var(--gold-soft);
  --accent-line:var(--gold-line);

  --serif-display:'Fraunces', serif;
  --serif-body:'Literata', serif;
  --mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,.03), transparent 60%),
    var(--ink);
  color:var(--paper);
  font-family:var(--serif-body);
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

::selection{ background:var(--accent-soft); color:var(--paper); }

a{ color:inherit; }

.wrap{ max-width:840px; margin:0 auto; padding:0 22px; }

/* ---------- header / nav ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:rgba(26,24,21,.88);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--rule-soft);
}
.top-inner{
  max-width:840px; margin:0 auto; padding:14px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
}
.brand{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--paper-dim); white-space:nowrap;
}
.brand b{ color:var(--paper); font-weight:600; }
nav.tabs{ display:flex; gap:4px; }
nav.tabs button{
  font-family:var(--mono); font-size:12px; letter-spacing:.04em;
  background:none; border:1px solid transparent; color:var(--paper-dim);
  padding:7px 12px; border-radius:20px; cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:color .15s, border-color .15s, background .15s;
}
nav.tabs button .dot{
  width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55;
}
nav.tabs button:hover{ color:var(--paper); }
nav.tabs button[aria-current="true"]{
  color:var(--ink); background:var(--tab-accent, var(--paper));
  border-color:transparent;
}
nav.tabs button[aria-current="true"] .dot{ opacity:1; }
nav.tabs button:focus-visible, .subnav a:focus-visible, .filterbox input:focus-visible, .seal:focus-visible{
  outline:2px solid var(--paper); outline-offset:2px;
}

@media (max-width:640px){
  .top-inner{ padding:12px 16px; gap:10px; }
  .brand{ display:none; }
  nav.tabs{ width:100%; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{ flex:0 0 auto; }
}

/* ---------- hero (home) ---------- */
.hero{ padding:64px 0 30px; }
.hero .eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--paper-faint); margin-bottom:18px;
}
.hero h1{
  font-family:var(--serif-display); font-weight:700; font-style:italic;
  font-size:clamp(34px,7vw,58px); line-height:1.04; margin:0 0 20px;
  letter-spacing:-.01em;
}
.hero h1 em{ font-style:normal; color:var(--gold); }
.hero p.lead{
  font-size:18px; color:var(--paper-dim); max-width:560px; margin:0 0 6px;
}
.hero .meta{ font-family:var(--mono); font-size:12px; color:var(--paper-faint); margin-top:14px; }

/* ---------- seals (home cards) ---------- */
.seals{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:38px 0 46px;
}
@media (max-width:720px){ .seals{ grid-template-columns:1fr; } }
.seal{
  --sc: var(--gold); --scs: var(--gold-soft); --scl:var(--gold-line);
  display:block; text-align:left; cursor:pointer;
  background:linear-gradient(160deg, var(--ink-card), var(--ink-card-2));
  border:1px solid var(--rule); border-radius:14px;
  padding:22px 20px 20px; position:relative; overflow:hidden;
  transition:transform .18s ease, border-color .18s ease;
}
.seal:hover{ transform:translateY(-3px); border-color:var(--scl); }
.seal::before{
  content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:var(--sc);
}
.seal .num{ font-family:var(--mono); font-size:11px; color:var(--sc); letter-spacing:.12em; }
.seal h3{
  font-family:var(--serif-display); font-weight:700; font-size:23px; margin:10px 0 3px;
  color:var(--paper);
}
.seal .who{ font-size:13.5px; color:var(--paper-dim); margin-bottom:12px; }
.seal .thesis{ font-size:14px; color:var(--paper-dim); line-height:1.5; }
.seal .go{ margin-top:16px; font-family:var(--mono); font-size:11px; color:var(--sc); letter-spacing:.08em; }

.seal.s-platon{ --sc:var(--gold); --scs:var(--gold-soft); --scl:var(--gold-line); }
.seal.s-zola{ --sc:var(--verdigris); --scs:var(--verdigris-soft); --scl:var(--verdigris-line); }
.seal.s-woolf{ --sc:var(--plum); --scs:var(--plum-soft); --scl:var(--plum-line); }

/* ---------- comparison table (home) ---------- */
.compare{ margin:8px 0 60px; border:1px solid var(--rule); border-radius:14px; overflow:hidden; }
.compare-head{
  padding:16px 20px; border-bottom:1px solid var(--rule);
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--paper-faint);
}
table.artic{ width:100%; border-collapse:collapse; }
table.artic th, table.artic td{ padding:14px 18px; text-align:left; vertical-align:top; border-bottom:1px solid var(--rule-soft); font-size:14.5px; }
table.artic tr:last-child th, table.artic tr:last-child td{ border-bottom:none; }
table.artic th{
  font-family:var(--serif-display); font-weight:700; font-style:italic; font-size:17px; white-space:nowrap; width:120px;
}
table.artic td.q{ color:var(--paper-dim); width:220px; }
table.artic td.t{ color:var(--paper); }
tr.row-platon th{ color:var(--gold); }
tr.row-zola th{ color:var(--verdigris); }
tr.row-woolf th{ color:var(--plum); }

.note-box{
  margin:0 0 40px; padding:16px 18px; border-radius:10px;
  background:var(--accent-soft); border:1px solid var(--accent-line);
  font-size:14px; color:var(--paper-dim);
}
.note-box b{ color:var(--paper); }

/* ---------- work page ---------- */
.work-band{
  padding:44px 0 26px; border-bottom:1px solid var(--rule-soft);
}
.work-band .kicker{ font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.work-band h1{
  font-family:var(--serif-display); font-weight:700; font-style:italic;
  font-size:clamp(30px,6vw,46px); margin:0 0 8px; line-height:1.05;
}
.work-band .who{ color:var(--paper-dim); font-size:15px; margin-bottom:16px; }
.work-band .thesis{ font-size:16.5px; max-width:600px; color:var(--paper); }
.facts{ display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:20px; }
.facts div{ font-size:12.5px; color:var(--paper-faint); }
.facts b{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:3px; }

.subnav{
  position:sticky; top:57px; z-index:30;
  background:rgba(26,24,21,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule-soft);
  overflow-x:auto; white-space:nowrap; -ms-overflow-style:none; scrollbar-width:none;
}
.subnav::-webkit-scrollbar{ display:none; }
.subnav .in{ max-width:840px; margin:0 auto; padding:0 22px; display:flex; gap:2px; }
.subnav a{
  display:inline-block; font-family:var(--mono); font-size:12px; letter-spacing:.03em;
  color:var(--paper-dim); text-decoration:none; padding:12px 14px; border-bottom:2px solid transparent;
}
.subnav a:hover{ color:var(--paper); border-color:var(--rule); }

section.block{ padding:44px 0; border-bottom:1px solid var(--rule-soft); }
section.block:last-of-type{ border-bottom:none; }
section.block h2{
  font-family:var(--serif-display); font-weight:700; font-size:26px; margin:0 0 6px;
  display:flex; align-items:baseline; gap:10px;
}
section.block h2 .n{ font-family:var(--mono); font-size:13px; color:var(--accent); }
section.block > .sub{ color:var(--paper-faint); font-size:13.5px; margin-bottom:26px; }

.prose p{ margin:0 0 14px; color:var(--paper); }
.prose p:last-child{ margin-bottom:0; }
.prose strong{ color:var(--paper); }

/* chapter accordions */
.chap{
  border:1px solid var(--rule); border-radius:12px; margin-bottom:10px;
  background:var(--ink-card); overflow:hidden;
}
.chap summary{
  list-style:none; cursor:pointer; padding:15px 18px;
  display:flex; align-items:center; gap:14px;
  font-family:var(--serif-display); font-size:16.5px; font-weight:600;
}
.chap summary::-webkit-details-marker{ display:none; }
.chap summary .roman{
  font-family:var(--mono); font-size:12px; color:var(--accent); flex:0 0 auto;
  border:1px solid var(--accent-line); border-radius:20px; padding:3px 9px;
}
.chap summary .arrow{ margin-left:auto; color:var(--paper-faint); transition:transform .18s ease; font-size:13px; }
.chap[open] summary .arrow{ transform:rotate(90deg); }
.chap .chap-body{ padding:0 18px 20px 18px; }
.chap .chap-body p{ color:var(--paper-dim); font-size:15px; margin:0 0 12px; }
.chap .chap-body blockquote{
  margin:14px 0 0; padding:10px 14px; border-left:2px solid var(--accent);
  color:var(--paper); font-style:italic; font-size:14.5px; background:var(--accent-soft); border-radius:0 8px 8px 0;
}

/* citations par chapitre */
.cits{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--rule); }
.cits-h{ font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.cit{ background:var(--ink-card-2); border:1px solid var(--rule-soft); border-left:2px solid var(--accent); border-radius:0 10px 10px 0; padding:14px 16px; margin-bottom:10px; }
.cit:last-child{ margin-bottom:0; }
.cit-tag{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-faint); margin-bottom:7px; }
.cit-cv .cit-tag{ color:var(--gold); }
.cit-q{ font-family:var(--serif-display); font-size:16px; line-height:1.45; color:var(--paper); }
.cit-c .cit-q, .cit-cv .cit-q{ font-style:italic; }
.cit-i .cit-q{ font-family:var(--serif-body); font-size:14.5px; }
.chap .chap-body .cit-ctx{ font-size:13.5px; color:var(--paper-dim); margin:9px 0 6px; line-height:1.55; }
.cit-ctx b, .cit-k b{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--paper-faint); margin-right:6px; font-weight:500; }
.cit-k{ font-size:13.5px; color:var(--paper); background:var(--accent-soft); border-radius:6px; padding:6px 10px; display:inline-block; }
.cit-ref{ margin-top:8px; font-family:var(--mono); font-size:11px; color:var(--paper-faint); }

/* axes */
.axes{ display:grid; gap:12px; }
.axis{
  border:1px solid var(--rule); border-radius:12px; padding:18px 20px;
  background:var(--ink-card);
}
.axis .letter{
  font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase;
}
.axis h3{ font-family:var(--serif-display); font-size:17px; font-weight:600; margin:5px 0 8px; }
.axis p{ font-size:14.5px; color:var(--paper-dim); margin:0; }

/* citations */
.filterbox{ margin-bottom:22px; }
.filterbox input{
  width:100%; background:var(--ink-card); border:1px solid var(--rule); border-radius:10px;
  padding:11px 14px; color:var(--paper); font-family:var(--serif-body); font-size:14.5px;
}
.filterbox input::placeholder{ color:var(--paper-faint); }
.qgrid{ display:grid; gap:12px; }
.qcard{
  border:1px solid var(--rule); border-radius:12px; padding:20px 22px;
  background:var(--ink-card); position:relative;
}
.qcard .theme{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.qcard .qtext{
  font-family:var(--serif-display); font-style:italic; font-size:17px; line-height:1.45; color:var(--paper);
}
.qcard .ref{ margin-top:12px; font-family:var(--mono); font-size:11.5px; color:var(--paper-faint); }
.qcard .tag{ display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--rule); color:var(--paper-dim); margin-left:8px; }
.qcard[hidden]{ display:none; }
.no-results{ color:var(--paper-faint); font-size:14px; padding:20px 0; display:none; }

/* repere list / timeline */
.reperes{ display:grid; gap:0; border-left:1px solid var(--rule); margin-left:6px; }
.repere{ position:relative; padding:0 0 22px 26px; }
.repere:last-child{ padding-bottom:0; }
.repere::before{
  content:""; position:absolute; left:-5px; top:5px; width:9px; height:9px; border-radius:50%;
  background:var(--accent); border:2px solid var(--ink);
}
.repere .when{ font-family:var(--mono); font-size:12px; color:var(--accent); margin-bottom:3px; }
.repere .what{ font-size:14.5px; color:var(--paper-dim); }

/* glossary table */
table.gloss{ width:100%; border-collapse:collapse; }
table.gloss td{ padding:12px 14px; border-bottom:1px solid var(--rule-soft); font-size:14px; vertical-align:top; }
table.gloss td:first-child{ font-family:var(--serif-display); font-style:italic; font-weight:600; color:var(--accent); white-space:nowrap; width:170px; }
table.gloss tr:last-child td{ border-bottom:none; }

/* people table (Woolf) */
table.people{ width:100%; border-collapse:collapse; }
table.people td{ padding:12px 14px; border-bottom:1px solid var(--rule-soft); font-size:14px; vertical-align:top; }
table.people td:first-child{ font-weight:600; color:var(--paper); width:170px; }
table.people td:nth-child(2){ color:var(--accent); font-family:var(--mono); font-size:11px; white-space:nowrap; width:110px; }
table.people tr:last-child td{ border-bottom:none; }

.subheading{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--paper-faint); margin:34px 0 14px;
}
.subheading:first-child{ margin-top:0; }

footer.site{ padding:40px 0 70px; text-align:center; }
footer.site p{ font-family:var(--mono); font-size:11.5px; color:var(--paper-faint); line-height:1.7; max-width:480px; margin:0 auto; }

@media (max-width:640px){
  .facts{ gap:10px 16px; }
  section.block{ padding:34px 0; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">Les <b>Arcanes</b> de la Création · Fiches</div>
    <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="site">
  <p>Fiches réalisées à partir des trois œuvres au programme (domaine public) et de plusieurs analyses. Vérifie toujours les citations mot pour mot dans tes éditions prescrites avant de les utiliser en dissertation.</p>
</footer>

<script>
/* ============================= DATA ============================= */

const OVERVIEW = {
  compare: [
    {work:'platon', label:'Platon', q:"D'où vient la création ?", t:"Inspiration divine, possession extérieure au créateur — le poète ne sait rien, il est traversé par une force qui n'est pas la sienne."},
    {work:'zola', label:'Zola', q:'Que coûte la création ?', t:"Épuisement, lutte intérieure, échec — Claude Lantier se détruit à vouloir accoucher d'un génie qu'il ne maîtrise jamais tout à fait."},
    {work:'woolf', label:'Woolf', q:'À quelles conditions peut-on créer ?', t:"Argent, espace, solitude protégée — la création n'est jamais une pure affaire de talent individuel, mais de conditions matérielles et sociales."},
  ]
};

const PLATON = {
  key:'platon', accentVar:'--gold', label:'Platon', workTitle:'Ion & La République (Livre X)',
  who:'Platon (v. 428–348 av. J.-C.)',
  thesis:"Le poète est un médiateur inspiré par les Muses, sans savoir réel ; la création artistique est suspecte philosophiquement car elle imite l'apparence, pas la vérité.",
  facts:[
    ['Genre','Dialogues philosophiques'],
    ['Édition du programme','GF Flammarion — trad. M. Canto-Sperber (Ion) & G. Leroux (République)'],
    ['Périmètre','Ion en entier · République, Livre X, 595a–608b uniquement'],
  ],
  subnav:[['presentation','Présentation'],['ion','Ion'],['republique','République X'],['axes','Axes'],['citations','Citations'],['concepts','Concepts'],['reperes','Repères']],

  presentation:`
    <p><b>Ion</b> est un dialogue de jeunesse, bref, à forme ouverte : Socrate y démonte pièce par pièce la prétention d'un rhapsode à posséder un art véritable.</p>
    <p><b>La République</b> est une œuvre de maturité en dix livres, consacrée à la définition de la justice et à la cité idéale. Le Livre X en constitue la conclusion, où Platon revient sur la question de la poésie déjà abordée au Livre III — <b>seul l'extrait 595a–608b est au programme</b> : la critique de la poésie mimétique, pas la suite du livre (immortalité de l'âme à partir de 608c, mythe d'Er à partir de 614a).</p>
    <p><b>Anecdote utile :</b> selon Diogène Laërce, le jeune Platon composait lui-même des poèmes avant de brûler ses écrits pour se consacrer à la philosophie après avoir entendu Socrate — la critique de la poésie est aussi, en un sens, le récit d'un renoncement personnel.</p>
  `,

  ion:[
    {n:'Prologue', t:'530a–530d', h:"Une rencontre après la victoire", p:"Socrate croise Ion d'Éphèse, rhapsode professionnel (récitant et interprète spécialisé d'Homère), qui revient d'un concours à Épidaure (fêtes d'Asclépios) où il vient d'être couronné. Socrate loue avec une ironie polie l'apparence brillante et la vie enviable des rhapsodes."},
    {n:'I', t:'530d–532b', h:'Le problème posé', p:"Socrate demande si le talent d'Ion porte seulement sur Homère, ou aussi sur d'autres poètes comme Hésiode ou Archiloque, qui traitent souvent des mêmes sujets. Ion répond qu'il n'excelle que sur Homère — et se montre même incapable de bien parler des autres."},
    {n:'II', t:'532b–533c', h:"L'universalité d'un art véritable", p:"Socrate établit que tout art véritable (technê) — peinture, sculpture, musique, arithmétique — porte sur un domaine entier et cohérent : celui qui sait juger un peintre sait juger tous les peintres. Si le talent d'Ion pour parler d'Homère relevait d'un art, il devrait donc s'étendre à tous les poètes traitant des mêmes sujets. Son incapacité à parler des autres poètes prouve que ce n'est pas un art qui l'anime."},
    {n:'III', t:'533c–536d', h:'La possession divine et la chaîne magnétique', p:"Socrate développe alors sa propre explication : ce qui rend Ion capable de bien parler d'Homère n'est pas un savoir technique mais une puissance divine (theia dynamis). Il convoque l'image restée célèbre de la pierre d'aimant (pierre de Magnésie / pierre d'Héraclée) : cette pierre n'attire pas seulement les anneaux de fer, elle leur transmet elle-même sa force d'attraction, si bien qu'ils peuvent à leur tour attirer d'autres anneaux — formant une chaîne entière. De la même façon, la Muse rend le poète entheos (« habité par le dieu »), et de proche en proche, à travers le rhapsode, cette possession (enthousiasme) se transmet jusqu'au spectateur. Le rhapsode est ainsi un « interprète d'interprète », placé à un troisième maillon de la source divine. Ion confirme lui-même son propre état de possession : réciter certains passages pathétiques le fait littéralement pleurer et lui hérisse les cheveux.", q:"Tous les bons poètes épiques ne composent pas en vertu d'un art, mais parce qu'ils sont inspirés et possédés. […] Ce qui les fait dire de si belles choses, ce n'est pas un art, c'est un don des dieux.", qref:'Ion, 533e–534a'},
    {n:'IV', t:'536d–541e', h:'Retour à l\u2019examen technique', p:"Socrate revient au concret : il interroge Ion sur des passages d'Homère traitant de domaines techniques précis — la médecine, la conduite d'un char, la pêche, la divination, l'art militaire. À chaque fois, Ion doit admettre qu'un spécialiste du domaine jugerait mieux que lui la justesse de ces passages. Poussé dans ses retranchements, Ion finit par prétendre qu'il ferait un excellent général grâce à sa connaissance des passages homériques sur la stratégie — ce que Socrate tourne en dérision : pourquoi alors n'est-il que rhapsode, et ne commande-t-il pas plutôt des armées ?"},
    {n:'Épilogue', t:'541e–542b', h:'Divin ou injuste : le dilemme final', p:"Socrate propose à Ion un dilemme : soit il possède réellement un art et un savoir sur Homère qu'il refuse malhonnêtement de démontrer (il serait alors injuste), soit il n'a aucun savoir technique et n'est mû que par une puissance divine qui le dépasse (il serait alors divin, mais pas savant). Ion, sans hésiter, choisit d'être qualifié de « divin » plutôt que d'« injuste ». Le dialogue s'arrête là, sans trancher davantage — forme ouverte typique des dialogues de jeunesse de Platon."},
  ],

  republique:[
    {n:'Ouverture', t:'595a–596a', h:'Rappel de la loi et aveu personnel', p:"Socrate rappelle une loi déjà posée au Livre III : la cité idéale doit bannir la poésie mimétique (tragédie, épopée) car elle est dangereuse. Il précise cependant, dès l'ouverture, éprouver lui-même « une certaine tendresse et un certain respect » pour Homère depuis l'enfance — aveu qui donne au texte une tonalité plus nuancée qu'un simple réquisitoire.", q:"Une certaine tendresse et un certain respect que j'ai dès l'enfance pour Homère me retiennent de parler.", qref:'République X, 595b'},
    {n:'I', t:'596a–598d', h:'Les trois degrés de mimesis : les trois lits', p:"Socrate développe l'argument central à partir de l'exemple d'un lit. Trois niveaux : (1) l'Idée du lit (eidos), modèle intelligible unique créé par le dieu — seule réalité pleinement vraie ; (2) le lit fabriqué par le menuisier, qui imite l'Idée pour produire un objet utilisable — déjà une copie ; (3) le lit peint par le peintre, qui n'imite que l'apparence du lit du menuisier, vu sous un certain angle — une copie de copie, « troisième à partir de la vérité ». Le poète mimétique se situe à ce troisième degré : il ne connaît ni l'Idée ni même le savoir-faire du fabricant.", q:"Le lit peint par le peintre n'est qu'une copie de copie du Lit véritable.", qref:'République X, 597e — « troisième à partir de la vérité »'},
    {n:'II', t:'598d–602b', h:'Le poète comme imitateur sans savoir réel', p:"Socrate montre qu'Homère, bien que représentant des médecins, des généraux, des artisans, ne possède en réalité aucune compétence dans ces domaines. Le poète est comparé à un homme qui, en promenant un miroir autour de lui, donnerait l'illusion de « créer » instantanément le soleil, les astres, les animaux, alors qu'il ne fait que réfléchir des apparences. L'imitateur est ainsi assimilé à un magicien, un illusionniste, qui exploite la crédulité de notre perception.", q:"Homère représente les médecins mais ignore la médecine, représente les chefs d'État mais ignore l'art de gouverner.", qref:'République X, 599c–e'},
    {n:'III', t:'601c–602b', h:'Usager, fabricant, imitateur', p:"Pour tout objet (une flûte, un mors de cheval), Socrate distingue trois positions de savoir : celui qui l'utilise possède le savoir le plus complet ; celui qui le fabrique a une opinion droite guidée par les indications de l'usager ; celui qui l'imite (le peintre, le poète) n'a ni l'un ni l'autre — il ne fait que reproduire l'apparence extérieure."},
    {n:'IV', t:'602c–606d', h:"La poésie et la partie irrationnelle de l'âme", p:"La poésie mimétique ne se contente pas de tromper l'intelligence, elle s'adresse directement à la partie irrationnelle de l'âme — celle qui pleure, se lamente — plutôt qu'à la raison. Socrate analyse le paradoxe du plaisir tragique : au théâtre, nous prenons plaisir à pleurer sur le malheur des héros, alors que dans la vraie vie nous nous efforçons de maîtriser notre propre douleur. Pour Platon, ce plaisir ne nous éduque pas (contrairement à ce que dira plus tard Aristote avec la catharsis) : il nourrit et fortifie la partie passionnelle de l'âme, au lieu de la dessécher.", q:"La poésie tragique flatte la partie de l'âme « qui a soif de larmes, qui voudrait soupirer à son aise et se rassasier de lamentations ».", qref:'République X, 606a'},
    {n:'V', t:'606e–608b', h:"La vieille querelle et la conclusion", p:"Socrate rappelle qu'Homère est traditionnellement « l'éducateur de la Grèce » — c'est précisément ce statut de mauvais pédagogue déguisé en sage qui inquiète Platon. Il nomme explicitement le conflit : « un très ancien désaccord entre la philosophie et la poésie ». Le texte se referme sur une position mesurée : Socrate ne bannit pas la poésie par mépris mais par prudence, car il reconnaît lui-même être sensible à son charme. Il propose une porte de sortie : si la poésie peut prouver qu'elle est utile et véridique, elle pourra être réintégrée dans la cité.", q:"Il y a un désaccord très ancien entre la philosophie et la poésie.", qref:'République X, 607b — palaia diaphora'},
  ],

  axes:[
    {t:"L'inspiration divine contre le savoir technique", p:"Dans Ion, la création poétique n'est explicable ni par la raison ni par la technique (technê) : c'est une possession, une force qui vient d'ailleurs et déresponsabilise le créateur — Ion préfère être « divin » plutôt que « savant mais malhonnête »."},
    {t:"L'art comme éloignement de la vérité", p:"Dans La République, la mimesis artistique est frappée d'un discrédit métaphysique : elle est une copie de copie, « troisième à partir de la vérité ». Ce n'est plus la question de savoir d'où vient la création (comme dans Ion), mais ce qu'elle vaut par rapport au réel."},
    {t:"Une tension interne à Platon lui-même", p:"Les deux textes ne disent pas exactement la même chose : Ion traite la possession poétique avec une certaine fascination ambiguë ; La République est beaucoup plus hostile et politique, allant jusqu'à l'exclusion des poètes de la cité. Souligner cette différence de ton est un bon point fin pour une dissertation qui les confronte plutôt que de les traiter comme un bloc unique."},
    {t:"L'art et le pouvoir sur l'âme et sur la cité", p:"Dans les deux textes, la poésie agit par contagion — la chaîne magnétique de Ion, la contagion émotionnelle du spectacle tragique dans La République — et non par argumentation rationnelle. C'est cette dimension irrationnelle et incontrôlable qui inquiète Platon, philosophiquement et politiquement."},
    {t:"Le philosophe lui-même pris dans le charme de l'art", p:"Platon ne se pose jamais en position de simple mépris : Socrate aime Homère (595b), Ion préfère la « divinité » à la honte d'être menteur. Le texte reconnaît la puissance réelle de la séduction poétique — c'est précisément parce qu'elle est puissante qu'elle doit être surveillée."},
    {t:"Mise en regard avec Zola et Woolf", p:"Face à Claude Lantier (la création comme souffrance et échec solitaire) et à la thèse de Woolf (la création comme question de conditions matérielles), Platon pose la question la plus radicale : la création vient-elle de l'artiste, ou à travers lui, depuis un ailleurs qui ne lui appartient pas ?"},
  ],

  presentation:`
    <p>Le roman s'inspire de l'amitié de jeunesse de Zola avec <b>Paul Cézanne</b> (et Jean-Baptiste Baille) à Aix-en-Provence — Plassans est la transposition d'Aix. Claude Lantier reprend des traits de Cézanne, mais aussi de Manet (le scandale de <i>Plein air</i> renvoie au scandale du <i>Déjeuner sur l'herbe</i> au Salon des refusés de 1863, épisode réel).</p>
    <p><b>Note critique :</b> on a longtemps dit que ce roman avait brouillé Zola et Cézanne définitivement ; les travaux récents relativisent cette thèse trop simple.</p>
    <p><b>Rattachement généalogique :</b> Claude Lantier est fils de Gervaise Macquart et d'Auguste Lantier (voir <i>L'Assommoir</i>) — seul membre de la famille Rougon-Macquart présent dans ce roman. Il porte la « fêlure » héréditaire de l'ancêtre Adélaïde Fouque (tante Dide), qui dans le cycle explique tour à tour génie, névrose et folie chez ses descendants.</p>
    <p><b>Intention de Zola</b> (notes préparatoires, hors-texte du roman) : « Avec Claude Lantier, je veux peindre la lutte de l'artiste contre la nature, l'effort de la création dans l'œuvre d'art, effort de sang et de larmes pour donner sa chair, faire de la vie : toujours en bataille avec le vrai et toujours vaincu, la lutte contre l'ange. »</p>

  resume:[

    {n:'II', h:'Sandoz, Dubuche et le père Malgras', p:"Sandoz, ami d'enfance de Claude, arrive à midi et lui sert de modèle pour son grand tableau Plein air. Les deux hommes évoquent leur jeunesse à Plassans (Claude cite Delacroix et Courbet comme ses maîtres). Dubuche les rejoint pour dîner. Le père Malgras vient acheter une toile à bas prix à Claude, insatisfait de son travail."},
    {n:'III', h:'La bande, le jeudi chez Sandoz', p:"Rongé par le doute, Claude retrouve le jeudi la « bande » réunie chez Sandoz : Bongrand, peintre déjà célèbre et bienveillant, ainsi que Mahoudeau, Jory, Gagnière, Chaîne. Longue promenade dans Paris, dîner chaleureux. Claude rentre regonflé, persuadé qu'il réalisera un jour un chef-d'œuvre."},
    {n:'IV', h:'Le retour de Christine', p:"Six semaines plus tard, Christine revient à l'atelier mais, gênée de se reconnaître dans la grande toile, repart aussitôt. Elle revient pourtant fin octobre 1862, puis prend l'habitude de visites régulières jusqu'en mai 1863 : une complicité amoureuse naît. Un jour, elle accepte de poser nue — la peinture retrouve un élan, et les deux jeunes gens échangent leur premier baiser."},
    {n:'V', h:'Le Salon des refusés', p:"Le 15 mai 1863, Claude expose Plein air au Salon des refusés (événement réel de l'histoire de l'art). La toile suscite les rires et l'humiliation publique de Claude. Fagerolles, présent, comprend déjà ce qu'il faudrait « adoucir » dans ce style pour plaire au public — préfigurant sa propre réussite future. La douleur partagée de cet échec rapproche définitivement Claude et Christine.", q:"Fagerolles sentait déjà ce qu'il faudrait pour que cette peinture fît la conquête de tous, quelques tricheries peut-être, quelques arrangements du sujet, un adoucissement de la facture.", qref:'ch. V'},
    {n:'VI', h:'Bennecourt', p:"Le couple fuit Paris pour s'installer à la campagne, à Bennecourt : quelques mois de bonheur amoureux complet. Christine tombe enceinte. Sandoz expose à ses amis son grand projet romanesque — transposition directe du projet des Rougon-Macquart de Zola. Dubuche fait un mariage bourgeois. Naissance de Jacques, atteint d'hydrocéphalie ; Christine se révèle piètre mère, préférant son rôle d'amante.", q:"Je vais prendre une famille, et j'en étudierai les membres, un à un, d'où ils viennent, où ils vont, comment ils réagissent, les uns sur les autres ; enfin, une humanité en petit, la façon dont l'humanité pousse et se comporte…", qref:'Sandoz, ch. VI'},
    {n:'VII', h:'Retour à Paris', p:"Claude rend visite aux différents membres de la « bande » et mesure leur évolution — certains s'embourgeoisent, d'autres s'enfoncent dans l'échec. Le soir, tous se retrouvent pour dîner chez Sandoz, rue Nollet."},
    {n:'VIII', h:"La toile de la Cité, le mariage", p:"Le couple s'installe rue de Douai. Claude travaille avec acharnement, mais ses paysages parisiens sont systématiquement refusés au Salon, trois années de suite. Il s'attaque à une composition immense : une vue de la Cité et de la Seine depuis le pont des Saints-Pères. Il finit par épouser Christine — mais la nuit de noces laisse déjà deviner l'effacement progressif du désir au profit de l'obsession picturale."},
    {n:'IX', h:'La jalousie de Christine', p:"Claude travaille sans relâche à sa grande toile : les quais restent à l'état d'esquisse magistrale, mais la grande figure féminine nue, peinte « dans la fièvre », détonne étrangement. Christine, servant de modèle malgré elle, devient jalouse de cette toile qui capte tout l'amour de Claude.", q:"Elle ne se trompait pas, elle sentait bien qu'il préférait sa copie à elle-même, que cette copie était l'adorée, la préoccupation unique, la tendresse de toutes les heures.", qref:'ch. IX'},
    {n:'X', h:"La mort de Jacques, l'ascension de Fagerolles", p:"La mort du petit Jacques, vers douze ans, laissé à l'abandon, ne devient pour Claude qu'un prétexte pictural — le tableau L'Enfant mort, envoyé au Salon sans succès. Fagerolles construit sa réussite officielle en édulcorant ouvertement le style de Claude, pendant que la sculpture de Mahoudeau, la Baigneuse, se fissure et s'effondre après le gel."},
    {n:'XI', h:'La crise du marché, la ruine de Dubuche', p:"Le marché de l'art traverse une crise spéculative. Dubuche, ruiné après avoir fait perdre de l'argent à son beau-père, se retrouve mis à l'écart — mais devient un père admirable, dévoué à ses enfants chétifs malgré la misère. Claude, de plus en plus reclus et halluciné, erre avec Sandoz sur les ponts de Paris.", q:"Il faut mourir pour avoir raison.", qref:'Claude à Sandoz, ch. XI'},
    {n:'XII', h:'La nuit finale et le suicide', p:"Une nuit de novembre, Claude retourne devant sa toile géante à la bougie et se remet à la retoucher fiévreusement. Christine, le sentant lui échapper, l'arrache un instant à « l'œuvre exécrée » — sursaut final et éphémère de la chair contre l'art. Mais Claude reste hanté par sa grande Femme nue, devenue à ses yeux une véritable idole. Il finit par se pendre devant son œuvre inachevée. Aux funérailles, seuls Bongrand et Sandoz sont présents. Le roman se clôt sur le retour au travail comme seule réponse possible au deuil.", q:"Qui donc venait de peindre cette idole d'une religion inconnue ? […] ce symbole du désir insatiable. — Trois grammes en moins ou trois grammes en plus. — Je ne veux pas m'en aller avec toi, je ne veux pas être heureux, je veux peindre. — Allons travailler.", qref:'ch. XII'},

/* ============================= RENDER ============================= */

const WORKS = { platon: PLATON, zola: ZOLA, woolf: WOOLF };
let current = 'home';

function esc(s){ return s; } // content is already safe, kept for clarity

function romanBadge(n){ return `<span class="roman">${n}</span>`; }

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const items = [
    {key:'home', label:'Vue d\u2019ensemble', accent:null},
    {key:'platon', label:'Platon', accent:'var(--gold)'},
    {key:'zola', label:'Zola', accent:'var(--verdigris)'},
    {key:'woolf', label:'Woolf', accent:'var(--plum)'},
  ];
  tabs.innerHTML = items.map(it => `
    <button data-key="${it.key}" aria-current="${current===it.key}" style="${current===it.key && it.accent ? `--tab-accent:${it.accent}`:''}">
      ${it.accent ? `<span class="dot" style="color:${it.accent}"></span>` : ''}${it.label}
    </button>
  `).join('');
  tabs.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ go(b.dataset.key); });
  });
}

function setAccent(work){
  const root = document.documentElement.style;
  if(!work){ root.setProperty('--accent','var(--gold)'); root.setProperty('--accent-soft','var(--gold-soft)'); root.setProperty('--accent-line','var(--gold-line)'); return; }
  root.setProperty('--accent', `var(${work.accentVar})`);
  root.setProperty('--accent-soft', `var(${work.accentVar}-soft)`);
  root.setProperty('--accent-line', `var(${work.accentVar}-line)`);
}

function go(key){
  current = key;
  window.scrollTo({top:0, behavior:'auto'});
  renderTabs();
  if(key==='home'){ setAccent(null); renderHome(); }
  else{ setAccent(WORKS[key]); renderWork(WORKS[key]); }
}

function citBlock(list){
  const lab = {c:'Citation', cv:'Citation · à vérifier mot à mot dans ton édition', i:'Idée clé · reformulation, pas une citation'};
  return `<div class="cits"><div class="cits-h">Citations à retenir</div>${list.map(x=>`
    <div class="cit cit-${x.t}">
      <div class="cit-tag">${lab[x.t]}</div>
      <div class="cit-q">${x.t==='i' ? x.q : '« '+x.q+' »'}</div>
      <div class="cit-ctx"><b>Contexte</b>${x.ctx}</div>
      <div class="cit-k"><b>À retenir</b>${x.k}</div>
      <div class="cit-ref">${x.ref}</div>
    </div>`).join('')}</div>`;
}

function chapterList(list){
  return list.map(c=>`
    <details class="chap">
      <summary>
        ${romanBadge(c.n)}
        <span>${c.h}${c.t ? ` <span style="color:var(--paper-faint);font-weight:400;font-size:13px;font-family:var(--mono)">· ${c.t}</span>`:''}</span>
        <span class="arrow">▸</span>
      </summary>
      <div class="chap-body">
        <p>${c.p}</p>
        ${c.cits ? citBlock(c.cits) : (c.q ? `<blockquote>« ${c.q} »<br><span style="opacity:.7;font-style:normal;font-family:var(--mono);font-size:11.5px">— ${c.qref}</span></blockquote>` : '')}
      </div>
    </details>
  `).join('');
}

function axesList(list){
  return `<div class="axes">${list.map((a,i)=>`
    <div class="axis">
      <div class="letter">${String.fromCharCode(97+i)}</div>
      <h3>${a.t}</h3>
      <p>${a.p}</p>
    </div>
  `).join('')}</div>`;
}

function citationGrid(list, id){
  return `
    <div class="filterbox">
      <input type="text" id="filter-${id}" placeholder="Filtrer les citations (thème, mot-clé…)" autocomplete="off">
    </div>
    <div class="qgrid" id="qgrid-${id}">
      ${list.map(q=>`
        <div class="qcard" data-search="${(q.theme+' '+q.text+' '+q.ref).toLowerCase()}">
          <div class="theme">${q.theme}${q.tag?`<span class="tag">${q.tag}</span>`:''}</div>
          <div class="qtext">« ${q.text} »</div>
          <div class="ref">${q.ref}</div>
        </div>
      `).join('')}
    </div>
    <div class="no-results" id="noresults-${id}">Aucune citation ne correspond à ta recherche.</div>
  `;
}

function attachFilter(id){
  const input = document.getElementById(`filter-${id}`);
  const cards = Array.from(document.querySelectorAll(`#qgrid-${id} .qcard`));
  const noRes = document.getElementById(`noresults-${id}`);
  input.addEventListener('input', ()=>{
    const v = input.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(c=>{
      const match = c.dataset.search.includes(v);
      c.hidden = !match;
      if(match) shown++;
    });
    noRes.style.display = shown===0 ? 'block' : 'none';
  });
}

function reperesList(list){
  return `<div class="reperes">${list.map(r=>`
    <div class="repere">
      <div class="when">${r[0]}</div>
      <div class="what">${r[1]}</div>
    </div>
  `).join('')}</div>`;
}

function renderWork(w){
  const app = document.getElementById('app');

  let body = `
    <div class="work-band">
      <div class="kicker">${w.key==='platon' ? 'Antiquité · IVᵉ s. av. J.-C.' : w.key==='zola' ? 'Roman · 1886' : 'Essai · 1929'}</div>
      <h1>${w.workTitle}</h1>
      <div class="who">${w.who}</div>
      <div class="thesis">${w.thesis}</div>
      <div class="facts">
        ${w.facts.map(f=>`<div><b>${f[0]}</b>${f[1]}</div>`).join('')}
      </div>
    </div>
    <div class="subnav"><div class="in">
      ${w.subnav.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('')}
    </div></div>
  `;

  body += `<section class="block" id="presentation"><h2>Présentation</h2><div class="prose">${w.presentation}</div></section>`;

  if(w.key==='platon'){
    body += `<section class="block" id="ion">
      <h2><span class="n">01</span> Ion</h2>
      <div class="sub">Résumé structuré — dialogue étudié en entier</div>
      ${chapterList(w.ion)}
    </section>`;
    body += `<section class="block" id="republique">
      <h2><span class="n">02</span> La République, Livre X</h2>
      <div class="sub">595a–608b uniquement — la critique de la poésie mimétique</div>
      ${chapterList(w.republique)}
    </section>`;
  } else {
    if(w.personnages){
      body += `<section class="block" id="personnages"><h2>Personnages principaux</h2>
        <table class="people">${w.personnages.map(p=>`<tr><td>${p[0]}</td><td></td><td>${p[1]}</td></tr>`).join('')}</table>
      </section>`;
    }
    body += `<section class="block" id="resume">
      <h2>Résumé ${w.key==='zola' ? '· 12 chapitres' : '· 6 chapitres'}</h2>
      <div class="sub">Clique sur un chapitre pour l\u2019ouvrir</div>
      ${chapterList(w.resume)}
    </section>`;
  }

  body += `<section class="block" id="axes"><h2>Axes de lecture</h2><div class="sub">Pour la dissertation</div>${axesList(w.axes)}</section>`;
  body += `<section class="block" id="citations"><h2>Citations</h2><div class="sub">Classées par thème — vérifie le mot à mot dans ton édition</div>${citationGrid(w.citations, w.key)}</section>`;

  if(w.key==='platon'){
    body += `<section class="block" id="concepts"><h2>Concepts</h2><div class="sub">Glossaire rapide</div>
      <table class="gloss">${w.concepts.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</table>
    </section>`;
  }
  if(w.key==='woolf'){
    body += `<section class="block" id="figures"><h2>Figures convoquées</h2><div class="sub">Réelles et fictives</div>
      <table class="people">${w.figures.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`).join('')}</table>
    </section>`;
  }

  body += `<section class="block" id="reperes"><h2>Repères</h2>${reperesList(w.reperes)}</section>`;

  app.innerHTML = body;
  attachFilter(w.key);
}

renderTabs();
renderHome();
</script>
</body>
</html>
